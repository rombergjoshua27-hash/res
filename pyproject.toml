[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflpredict"
version = "1.1.0"
description = "Walk-forward backtested NFL game outcome prediction model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    # Imported directly (normal CDF, logit) rather than only through
    # scikit-learn, so it is declared rather than relied on transitively.
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "requests>=2.28",
    "openpyxl>=3.1",
]

[project.scripts]
nflpredict = "nflpredict.cli:main"

[tool.setuptools.packages.find]
include = ["nflpredict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
