name: Refresh workbook

# Runs every morning. Scores, closing lines, listed quarterbacks and the
# injury report all move during a week, so a daily rebuild keeps the workbook
# current without anyone asking for it. The schedule also rolls the slate
# forward on its own: once a week is mostly played, the model starts
# predicting the next one.
on:
  schedule:
    # 11:00 UTC daily — after nflverse has published the overnight update,
    # early enough to be there before the morning on either US coast.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to predict (blank = current)"
        required: false
      week:
        description: "Week to predict (blank = next unplayed)"
        required: false

permissions:
  contents: write

concurrency:
  # A manual run while the nightly one is going would fight over the cache.
  group: refresh-workbook
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      # Everything here is re-downloadable, but rebuilding twenty seasons of
      # play-by-play every morning would be twenty minutes to discover that
      # finished seasons had not changed. Raw play-by-play is deliberately not
      # cached: it is ~350 MB and only ever an input to the summaries.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            data/epa
            data/players
            data/backtest
            data/games.csv
          key: nflpredict-data-${{ github.run_id }}
          restore-keys: |
            nflpredict-data-

      - name: Refresh and rebuild
        run: |
          nflpredict refresh --prune-raw --quiet \
            ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}

      - name: Name the workbook
        id: workbook
        run: |
          path="$(ls -t out/*.xlsx | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          # A second copy under a name that never changes. The dated name
          # identifies which week a build covers; the fixed one is what a
          # bookmark can point at.
          cp "$path" "nflpredict-latest.xlsx"

      # Two ways to get at it: an artifact on this run, and a release asset at
      # a stable URL that always points at the newest build.
      - name: Upload as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.workbook.outputs.name }}
          path: ${{ steps.workbook.outputs.path }}
          retention-days: 90

      # The release carries exactly one asset, under a name that does not move.
      # Uploading the dated filename instead would publish a *new* asset each
      # time the slate rolled to a new week -- --clobber only replaces a
      # same-named one -- so the download URL would change weekly and the
      # release would slowly fill up with every week of the season. The dated
      # builds are still kept, as the per-run artifacts above.
      - name: Publish to the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest workbook" \
              --notes "Rebuilt automatically every morning."
          fi
          gh release upload latest "nflpredict-latest.xlsx" --clobber
          gh release edit latest --notes "$(cat <<NOTES
          **[Download nflpredict-latest.xlsx](https://github.com/${{ github.repository }}/releases/download/latest/nflpredict-latest.xlsx)** — this link always serves the newest build, so it is safe to bookmark.

          Currently: **${{ steps.workbook.outputs.name }}**
          Rebuilt: $(date -u '+%Y-%m-%d %H:%M UTC')

          Rebuilt every morning at 11:00 UTC. The slate rolls forward on its own once a week is mostly played, and results are graded on the Season Scorecard tab as they land.
          NOTES
          )"

      - name: Summary
        run: |
          {
            echo "### Workbook rebuilt"
            echo ""
            echo "- **Covers:** \`${{ steps.workbook.outputs.name }}\`"
            echo "- **Stable link:** [nflpredict-latest.xlsx](../../releases/download/latest/nflpredict-latest.xlsx)"
            echo "- **This run's copy:** the artifact above"
          } >> "$GITHUB_STEP_SUMMARY"
